<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Confirmed — Automaton Quant Audit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #fbfbfd;
            --bg-card: #ffffff;
            --text-title: #1d1d1f;
            --text-body: #515154;
            --text-muted: #86868b;
            --accent: #0071e3;
            --accent-green: #34c759;
            --border-light: rgba(0, 0, 0, 0.08);
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-page);
            color: var(--text-title);
            padding: 60px 20px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 28px;
            padding: 48px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.04);
            text-align: center;
        }

        .icon-box {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(52, 199, 89, 0.12);
            color: var(--accent-green);
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-body);
            font-size: 17px;
            max-width: 580px;
            margin: 0 auto 32px auto;
        }

        .upload-section {
            background: var(--bg-page);
            border: 2px dashed var(--accent);
            border-radius: 20px;
            padding: 40px;
            margin: 32px 0;
            text-align: center;
        }

        .upload-input {
            display: none;
        }

        .btn-upload {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent);
            color: white;
            padding: 14px 28px;
            border-radius: 980px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-upload:hover {
            background: #0077ed;
            transform: scale(1.02);
        }

        .status-box {
            display: none;
            background: #e0f2fe;
            border: 1px solid #7dd3fc;
            color: #0369a1;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">✓</div>
        <h1 id="title-heading">Verifying PayPal Payment...</h1>
        <p id="sub-heading">Connecting to serverless API to confirm order capture status.</p>

        <div id="status-toast" class="status-box"></div>

        <!-- Upload Strategy Form -->
        <div id="upload-box" class="upload-section" style="display: none;">
            <h3 style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">Upload Strategy Backtest Data</h3>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">
                Select your backtest return series CSV or trade log JSON file for automated 1,000-block Monte Carlo audit.
            </p>
            <form id="upload-form">
                <input type="file" id="file-input" class="upload-input" accept=".csv,.json" required>
                <label for="file-input" class="btn-upload">Choose Strategy File (.CSV / .JSON)</label>
            </form>
            <div id="file-name" style="margin-top: 14px; font-size: 14px; font-weight: 500; color: var(--accent);"></div>
            <button id="btn-submit-audit" class="btn-upload" style="margin-top: 20px; background: var(--accent-green); display: none;">Start Automated Audit</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const transactionId = params.get('tx') || params.get('txn_id') ||
                                  params.get('order_id') || params.get('orderID') ||
                                  params.get('token');
            const status = (params.get('st') || params.get('status') || '').toLowerCase();
            const amount = params.get('amt') || params.get('amount') || null;
            const currency = params.get('cc') || params.get('currency') || null;

            const titleHeading = document.getElementById('title-heading');
            const subHeading = document.getElementById('sub-heading');
            const toast = document.getElementById('status-toast');

            const isLikelyPaid = Boolean(transactionId && (['completed', 'success', 'processed'].includes(status) || status === ''));

            if (isLikelyPaid) {
                titleHeading.innerText = 'Pago Recibido — En Verificación';
                subHeading.innerText = 'Transacción PayPal: ' + transactionId + (amount ? ' (' + '$' + amount + ' ' + (currency || 'USD') + ')' : '') + '. Tu certificado o reporte de auditoría llegará a tu correo en los próximos minutos tras la verificación automática del servidor.';
                toast.style.display = 'block';
                toast.style.background = '#e0f2fe';
                toast.style.borderColor = '#7dd3fc';
                toast.style.color = '#0369a1';
                toast.innerText = '✓ Pago recibido. Tu certificado llegará a tu correo en los próximos minutos tras la verificación automática (Ref: ' + transactionId + ').';
            } else {
                titleHeading.innerText = 'Payment Verification Pending';
                subHeading.innerText = 'No PayPal transaction reference detected in URL parameters. Please complete checkout from the pricing section.';
                toast.style.display = 'none';
            }
        });
    </script>

</body>
</html>
